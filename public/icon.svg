<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="50%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#0d9488" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>
  
  <!-- App Icon Squircle Background -->
  <rect x="24" y="24" width="464" height="464" rx="110" fill="url(#grad)" filter="url(#shadow)"/>
  
  <!-- Subtle Internal Grid / Moroccan Accent Ring -->
  <circle cx="256" cy="256" r="160" fill="none" stroke="#ffffff" stroke-opacity="0.15" stroke-width="4" stroke-dasharray="12 12"/>

  <!-- Barcode Vertical Lines in Center -->
  <g fill="#ffffff">
    <rect x="156" y="180" width="14" height="120" rx="4"/>
    <rect x="182" y="180" width="8" height="120" rx="3"/>
    <rect x="202" y="180" width="22" height="120" rx="4"/>
    <rect x="236" y="180" width="10" height="120" rx="3"/>
    <rect x="258" y="180" width="18" height="120" rx="4"/>
    <rect x="288" y="180" width="8" height="120" rx="3"/>
    <rect x="308" y="180" width="24" height="120" rx="4"/>
    <rect x="344" y="180" width="12" height="120" rx="4"/>
  </g>

  <!-- Scanner Target Corners -->
  <path d="M 120 180 L 120 140 A 20 20 0 0 1 140 120 L 180 120" fill="none" stroke="#ffffff" stroke-width="14" stroke-linecap="round"/>
  <path d="M 332 120 L 372 120 A 20 20 0 0 1 392 140 L 392 180" fill="none" stroke="#ffffff" stroke-width="14" stroke-linecap="round"/>
  <path d="M 120 300 L 120 340 A 20 20 0 0 0 140 360 L 180 360" fill="none" stroke="#ffffff" stroke-width="14" stroke-linecap="round"/>
  <path d="M 332 360 L 372 360 A 20 20 0 0 0 392 340 L 392 300" fill="none" stroke="#ffffff" stroke-width="14" stroke-linecap="round"/>

  <!-- Scanning Red Laser Glow -->
  <line x1="120" y1="240" x2="392" y2="240" stroke="#f43f5e" stroke-width="8" stroke-linecap="round"/>
  
  <!-- Health & Nature Leaf at bottom right -->
  <g transform="translate(320, 310)">
    <circle cx="45" cy="45" r="46" fill="#ffffff" filter="url(#shadow)"/>
    <path d="M 45 22 C 30 22 24 38 28 54 C 32 64 45 68 62 68 C 66 52 62 22 45 22 Z" fill="#10b981"/>
    <path d="M 28 54 Q 45 42 62 68" stroke="#ffffff" stroke-width="3" fill="none"/>
  </g>
</svg>
